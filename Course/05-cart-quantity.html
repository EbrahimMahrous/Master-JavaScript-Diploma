<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart Quantity</title>
  </head>
  <body>
    <!-- 
    camelCase ==> cartQuantity    ==> use in javascript
    PascalCase ==> CartQuantity

    Kebab-case ==> cart-quantity   ==> use in HTML, Css and naming files

    snake-case ==> cart_quantity  ==> used in other language but not use in javascript.
    -->
    <button onclick="
    console.log(`cartQuantity = ${cartQuantity}`)
    ">Show quantity</button>


    <button onclick="
    cartQuantity++;
    console.log(`cartQuantity = ${cartQuantity}`)
    ">Add to cart</button>


    <button onclick="
    cartQuantity += 2;
    console.log(`cartQuantity = ${cartQuantity}`)
    ">+2</button>


    <button onclick="
     cartQuantity += 3;
     console.log(`cartQuantity = ${cartQuantity}`)
    ">+3</button>


    <button onclick="
    cartQuantity = 0;
    console.log('cart was reset')
    console.log(`cartQuantity = ${cartQuantity}`)
    ">Reset Cart</button>

    <script>
      let cartQuantity = 0;
    </script>
  </body>
</html>
