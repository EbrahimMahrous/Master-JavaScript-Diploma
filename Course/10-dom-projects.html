<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Projects</title>
    <style>
        body{
            font-family: Arial;
        }
        .subscribe-button{
            border: none;
            background-color: black;
            color: white;
            padding: 10px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            margin-bottom: 30px;
        }
        .is-subscribed{
            color: black;
            background-color: rgb(240, 240, 240);
        }
        .cost-input{
            font-size: 15px;
            padding: 10px;
        }
        .calculate-button{
            background-color: green;
            color: white;
            border: none;
            font-size: 15px;
            padding: 12px 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Project 1 -->
    <p>YouTube Subscribe Button</p>
    <button onclick="subscribe()" class="js-subscribe-button subscribe-button">Subscribe</button>


    <!-- Project 2 -->
    <p>Amazon Shipping calculator</p>
    <input class="js-cost-input cost-input" placeholder="Cost of order" onkeydown="handleCostKeydown(event)"> 
    <button onclick="CalculateTotal()" class="calculate-button" >Calculate</button>
    <p class="js-total-cost" ></p>

    <script>
        function handleCostKeydown(event){
            if(event.key === 'Enter'){
                CalculateTotal()
            }
        }

        function CalculateTotal(){
            const inputElement =  document.querySelector('.js-cost-input')
            let cost = Number(inputElement.value)  
            if(cost < 40){
                cost = cost + 10
             }
            document.querySelector('.js-total-cost').innerHTML = `$${cost}`
        }

        function subscribe(){
            const buttonElement = document.querySelector('.js-subscribe-button')
            if(buttonElement.innerText === 'Subscribe'){
                buttonElement.innerHTML = 'Subscribed'
                /*
                .classList = gives us control of the class attribute. 
                    One solution:
                    1. Add a class.
                    2. This class will have different styles.
                */
                buttonElement.classList.add('is-subscribed')                       // classList is an object.
            }else{
                buttonElement.innerHTML = 'Subscribe'
                buttonElement.classList.remove('is-subscribed')
            }
        }
    </script>
</body>
</html>
