<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booleans</title>
  </head>
  <body>
    <script>


        true
        false
        console.log(3 < 5)         // true
        console.log(3 > 5)         // false
        console.log(5 == '5.00')   // true
        console.log(5 === '5.00')  // false

        if(true){
            console.log('hello')
        }else{
            console.log('else')
        }


        const age = 15;

        if (age >= 16) {
            console.log('You can drive');
            console.log('Congrats');
        } else if (age >= 14) {
            console.log('Almost there!');
        } else {
            console.log('You can not drive');
        }



      
      console.log(true && false);
      console.log(0.2 >= 0 && 0.2 < 1 / 3);

      console.log(true || false);
      console.log(!false);
      

      // Falsy Values ==> false      0      ''        NaN        undefiend[something dosen't have a value]         null
      
      if (0) {
        console.log('truthy');
      }

      const cartQuantity = 5;

      if (cartQuantity) {
        console.log('cart has products');
      }

      console.log(!0);   // true
      
      console.log('text' / 5); // NaN

      const variable1 = undefined;
      console.log(variable1);       // undefiend
      

      // shortcuts for if-Statements
      // 1. Ternary Operator ? :
      // 2. Guard Operator &&
      // 3. Default Operator ||

      const result = 0 ? 'truthy' : 'falsy';
      console.log(result);

      false && console.log('hello');   // false

      const message = 5 && 'hello';
      console.log(message);            // true

      const currency = undefined || 'USD';
      console.log(currency);  // true
    </script>
  </body>
</html>
