        // More details about loops.    1.break = exit a loop early.   2.continue = skip 1 iteration.
        for(let i =1; i <= 10; i++){
            // Skip a number if it's divisible by 3
            // divisible by 3 = can be divided evenly into 3
            if (i % 3 === 0){
                continue;
            }
            // When i =8, stop this loop early.
            if (i === 8){

            }
