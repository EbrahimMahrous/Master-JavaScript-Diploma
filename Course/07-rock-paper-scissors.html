
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
  </head>
  <body>

    <!-- 
    06- In this lesson:
    1. Boolean values (true, false)
    2. if- statements
    3. Comparion Operators (>, <, >=, <=, ===, !==) Logical Operators (&&, ||, !)
    4. Algorithms, and created rock paper scissors
    5. Truthy and falsy values
    6. shortcuts for if-statements (ternary, quard, default)
    -->

    <!-- 
        Strategy for JavaScript
        1. Think about what steps we need.
        2. Convert those steps into code.
    -->

    <!-- 
        Steps (Algorithm) 
        When we click a button:
        1. Computer randomly selects a move.
        2. Compare the moves to get the result.
        3. Display the result in a popup.    
    -->

    <p>Rock Paper Scissors</p>


    <button onclick="playGame('rock')">Rock</button>
    <button onclick="playGame('paper')">Paper</button>
    <button onclick="playGame('scissors')">Scissors</button>


    <script>

        /*
        07- In this lesson:
        1. Function = let us reuse code.
        2. Return = get a value out of a function.
        3. Parameters = put values into a function.
        4. Improved the code for Rock, Paper, Scissors.
        */

        function playGame(playerMove){
            const computerMove = picComputerMove()
            let result = ''

            if(playerMove === 'scissors'){
                if (computerMove === 'rock'){
                    result = 'You lose.'
                }else if(computerMove === 'paper'){
                    result = 'You win.'
                }else if(computerMove === 'scissors'){
                    result = 'Tie.'
                }

            } else if(playerMove === 'paper'){
                if (computerMove === 'rock'){
                    result = 'You win.'
                }else if(computerMove === 'paper'){
                    result = 'Tie.'
                }else if(computerMove === 'scissors'){
                    result = 'You lose.'
                }

            } else if(playerMove === 'rock'){
                if (computerMove === 'rock'){
                    result = 'Tie.'
                }else if(computerMove === 'paper'){
                    result = 'You lose.'
                }else if(computerMove === 'scissors'){
                    result = 'You win.'
                }
            }


            alert(`You picked ${playerMove}. Computer picked ${computerMove}. ${result}`)
        }

        // computerMove is not defined at HTMLButtonElement.onclick 
        // to solve this problem you will use to solution ==> Global Variable or Return.

        // Best practice ==> Keep variable inside a scope (if we can).

        //  Use a verb / action for naming function.
        function picComputerMove(){
            const randomNumber = Math.random();
            let computerMove = '';      
            if(randomNumber >= 0 && randomNumber < 1/3 ){
                computerMove = 'rock';
            }else if(randomNumber >= 1 /3 && randomNumber < 2/3){
                computerMove = 'paper';
            } else if(randomNumber >= 2 /3 && randomNumber < 1){
                computerMove = 'scissors';
            }
            return computerMove;
            }

            // Return Statement ==> lets us get a value out of a function.
    </script>

  </body>
</html>
