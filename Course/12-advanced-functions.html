        // More features that use functions as values.
        // 2 more array methods:  .filter()  and  .map()

        // .filter() [1, -3, 5] ==> [1, 5]   Negative numbers removed.

        // .filter()
        // 1. creates a new array[]
        // 2. return true, 
        //       ==> put value in array.
        // 3. return false,
        //       ==> not put value in array.

            // return true if positive.

        // .map()
        // .map() = transform an array into another array.
        // 1. creates a new array []
        // 2. Whatever we return ==> added to new array.
        // [1, 1, 3] ==> [2, 2, 6]

        console.log([1, 1, 3].map((value, index) => {
