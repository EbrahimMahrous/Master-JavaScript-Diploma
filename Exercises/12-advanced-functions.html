let messages = 2;

// Save the intervalId in case we need to cancel it.

let intervalId;

// We'll use this variable to keep track of whether or not we're displaying the notification.
let isDisplayNotification;

// Start displaying the notification in the tab when the page first loads.
displayNotification()

function displayNotification(){
    // If we're already displaying the notification, stop this function because we don't want to create 2 intervals at the same time.
    if(isDisplayNotification){
        return
    }

    isDisplayNotification = true;

    intervalId = setInterval(function(){
        if(document.title === 'App'){
            document.title = `(${messages} New Messages)`
        }else{
            document.title = 'App'
        }
    }, 2000)
}

function stopNotification(){
    isDisplayNotification = false
    clearInterval(intervalId)
    document.write = 'App'
}

/*
121. Create a function countPositive(nums) that takes an array of numbers and returns how many numbers in the array are greater than O. Create this function using .forEach() instead of a loop.
• countPositive([1, -3, 5]) => 2
• countPositive([-2, 3, -5, 7, 10]) => 3
*/

function countPositive(nums){

    let positiveNumbers = 0;
    // When there is only 1 parameter, the brackets are optional. So we can also write: num => { ... }

    nums.forEach(num => {
        if(num > 0){
            positiveNumbers++;
        }
    });

    return positiveNumbers
}

console.log(countPositive([1, -3, 5]))
console.log(countPositive([-2, 3, -5, 7, 10]))

    return array.map((value) => value + num);
