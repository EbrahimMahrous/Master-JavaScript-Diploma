11b. Create a function getLastVaIue(array) that takes an array and returns the last value in the array.
Hint: array indexes start at O so the last index is the number of values in the array minus 1
(lastlndex = array.length - 1).
• getLastValue([1, 20, 22, 24, 5]) ==> 5
• getLastValue(['hi', hello', 'good']) ==> 'good'
*/

function getLastValue(array){
    const lastIndex = array.length - 1
    return array[lastIndex]
}

/*
حلووة اوووي
11c. Create a function arraySwap(array) that takes an array and returns an array where the first and last values are swapped (or switched).
• arraySwap([1, 20, 22, 24, 5]) ==> [5, 20, 22, 24, 1]
• arraySwap(['hi', hello', 'good']) ==> ['good', 'hello', 'hi']
*/
    function arraySwap(array){
        let lastIndex = array.length -1

        // We need to save the values first before
        // swapping. Otherwise, if we swap directly,
        // we would lose one of the values.
        let lastValue = array[lastIndex]
        let firstValue = array[0]

        array[0] = lastValue
        array[lastIndex] = firstValue

        return array
    }
    console.log(arraySwap([1, 20, 22, 24, 5]))

/*

/*
11i. Create a function addNum(array, num) that takes an array of numbers and returns an array where each number is increased by 'num'.
• addNum([1, 2, 3], 2) ==> [3, 4, 5]
• addNum([1, 2, 3], 3) ==> [4, 5, 6]

/*

/*
11k. Create a function countPositive(nums) that takes an array of numbers and returns how many numbers in the array are greater than 0.
• countPositive([1, -3, 5]) ==> 2
• countPositive([-2, 3, -5, 7, 10]) ==> 3
*/

    function countPositive(nums){
        let result = 0
        for(let i = 0; i < nums.length; i++){
            if (nums[i] > 0){
                result++
            }
        }
        return result
    }

    console.log(countPositive([1, -3, 5]))

/*
11i. Create a function minMax(nums) that takes an array of numbers and returns an object with the minimum and maximum numbers in the array (do this using a loop instead of using something like Math.min).
• minMax([1, -3, 5]) => { min: -3, max: 5}
• minMax([-2, 3, -5, 7, 10]) => { min: -5, max: 10 }
*/

    function minMax(nums){
        // We'll set the starting values of min and max
        // as the first value in the array. (This is just one way to set the starting values. You can use another way if you like.)
        let result = {
            min: nums[0] , 
            max: nums[0]
            }

        for(let i = 0; i < nums.length; i++){
            const value = nums[i]
            if(value < result.min){
                result.min = value
            }
            if (value > result.max){
                result.max = value
            }
 
        }
        return result
    }
    console.log(minMax([1, -3, 5]))
    console.log(minMax([-2, 3, -5, 7, 10]))


/*
11m. Update exercise 11i to also handle these cases:
• minMax([]) => { min: null, max: null }
• minMax([3]) => { min: 3, max: 3}
*/

function minMax(nums){
            // We'll set the starting values of min and max to null this time.
        let result = {
            min: null , 
            max: null
            }

        for(let i = 0; i < nums.length; i++){
            const value = nums[i]
            // If the min is null OR the value is less than the min, update the min.
            if(result.min == null || value < result.min){
                result.min = value
            }
            // If the max is null OR the value is greater than the max, update the max.
            if (result.min == null || value > result.max){
                result.max = value
            }
 
        }
        // We have to use 2 if-statements above instead of an if-else statement. This makes sure both the min and max are set if they are null.
        return result
    }
    console.log(minMax([]))
    console.log(minMax([3]))



/*
lln. Create a function countWords(words) that takes an array of strings and returns an object with how many times each string appeared.

• countWords(['apple', 'grape', 'apple', 'apple']) => { apple: 3, grape: 1 } 
(Hint: you can access a property using a variable: object[variable]; This uses the value inside the variable as the property name).
*/

// المثال دا حلو اوووي بجد
    function countWords(words){
        const result = {}
        for(let i =0; i< words.length; i++){
            const word = words[i]

            if(!result[word]){
                result[word] = 1
            }else{
                result[word]++
            }
        }
        return result
    }
    console.log(countWords(['apple', 'grape', 'apple', 'apple']))
