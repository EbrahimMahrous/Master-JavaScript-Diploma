 <!-- Project 2 -->
 <p>Amazon Shipping calculator</p>
 <input class="js-cost-input cost-input" placeholder="Cost of order" onkeydown="handleCostKeydown(event)"> 
 <button onclick="CalculateTotal()" class="calculate-button" >Calculate</button>
 <p class="js-total-cost" ></p>
 <p class="js-error-message error-message"></p>






















    <script>
        const isClassContain = document.querySelector('.js-button')
        console.log(isClassContain.classList.contains('js-button'))   // true

// 10f. Continuing from IOe, use a function to reuse the code, and separate each language into its own file (if you didn't do this already).
// 10g. Modify 10f so that only 1 button can be ON at a time.
        function isToggled(selector){
            const button = document.querySelector(selector)

            if(!button.classList.contains('is-toggled')){
                turnOffPreviousButton()
                button.classList.add('is-toggled')
                
            }else{
            
            button.classList.remove('is-toggled')
        
            }
        }

        function turnOffPreviousButton(){
            const previousButton = document.querySelector('.is-toggled')
            if(previousButton){
                previousButton.classList.remove('is-toggled')
            }
        }

/*
10h. Create a file 10h.htmI and copy the code from 10-dom-projects.html. In the Amazon Shipping Calculator, if we type a number less than O, display a red error message below the text box:

Calculate
Error: cost cannot be less than $0
*/

function handleCostKeydown(event){
            if(event.key === 'Enter'){
                CalculateTotal()
            }
        }

        function CalculateTotal(){
            const inputElement =  document.querySelector('.js-cost-input')
            let cost = Number(inputElement.value) 
            if (cost < 0) {
                    document.querySelector('.js-error-message')
                        .innerHTML = 'Error: cost cannot be less than $0';
                    // If we display an error, we can use return to
                    // end this function immediately. This is called
                    // an "early return" and it makes the code cleaner
                    // because it reduces nesting / indents.
                    return;
            } 

            if(cost < 40){
                cost = cost + 10
             }
            document.querySelector('.js-total-cost').innerHTML = `$${cost}`
        }

    </script>
