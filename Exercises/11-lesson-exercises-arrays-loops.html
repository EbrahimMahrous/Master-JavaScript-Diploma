/*
11u. In exercise 11t, one problem with .reverse() is that it doesn't create a copy of the array it is reversing. It modifies the original array. Update the code so the function does not modify the original array. (Hint: use the .slice() method to create a copy of an array's values).
• const foods = ['egg', 'apple', 'egg', 'egg', 'harm'];
• console.log(removeEgg(foods)) => ['egg', 'apple', 'harm']
• console.log(foods) => ['egg', 'apple', 'egg', 'egg', 'harm']
*/

// جامد اووووي دا
function removeEgg(foods){
        const result = []
        // To prevent modifying the original array, we can create a copy of the array using .slice()
        const foodsCopy = foods.slice();
        const reversedFoods = foodsCopy.reverse();
        // Advanced technique:
        // Since foods.slice() results in an array, we can also use .reverse() directly like this: foods.slice().reverse();
        
        // This technique is called "method chaining" because we use one method after another (like a chain of methods).

        let eggsRemoved = 0;

        for(let i = 0; i < reversedFoods.length; i++){
            if(reversedFoods[i] === 'egg' && eggsRemoved < 2){
                eggsRemoved++
                 continue;
            }
          result.push(reversedFoods[i])
        }
        return result.reverse()
    }
    const foods = ['egg', 'apple', 'egg', 'egg', 'ham'];

/*

11v. We'll do the famous FizzBuzz problem. Create a loop that displays 1 to 20 in the console. If the number is divisible by 3, display 'Fizz' instead of the number. If it's divisible by 5, display 'Buzz' instead. If it's divisible by 3 and 5, display 'FizzBuzz' instead. (Reminder: divisible by 3 means num % 3 === 0)
• 1, 2, Fizz, 4, Buzz, Fizz, 7, 8 ... 13, 14, FizzBuzz, 16, 17, ....
*/


for(let i = 1; i <= 20; i++){
    // The trick to this problem is to check if the number is divisible by 3 and 5 first. Otherwise, it will always display 'Fizz'.

    if(i % 3 === 0 && i % 5 === 0){
        console.log('FizzBuzz')
    } else if(i % 3 === 0){
        console.log('Fizz')
    } else if(i % 5 === 0){
        console.log('Buzz')
    }else{
        console.log(i)
    }
}


/*
11w. Create a copy of exercise llq, where we created findlndex(). Below it, create a function unique(array) that takes an array of strings and returns an array where each string only appears once (there are no duplicates). Try to use the findlndex() function in your solution.
• unique(['green', 'red', 'blue', 'red']) => ['green', 'red', 'blue']
• unique(['red', 'green', 'green', 'red']) => ['red', 'green']
*/


    function findIndex(array, word) {
        for (let i = 0; i < array.length; i++) {
          if (array[i] === word) {
            return i;
          }
        }
        return -1;
    }

    function unique(array) {
        const result = [];

        for (let i = 0; i < array.length; i++) {
          const word = array[i];

        // Using the findIndex() function from above, we can check if the string is already in the result array.
        // If it's not in the result array (index is -1), then add it to the result array.
        if (findIndex(result, word) === -1) {
            result.push(word);
          }
        }

        return result;
    }

      console.log(unique(['green', 'red', 'blue', 'red']));
      console.log(unique(['red', 'green', 'green', 'red']));
