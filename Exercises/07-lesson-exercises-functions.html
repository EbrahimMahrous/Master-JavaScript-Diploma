function greet(name){
    if(!name){
        console.log(`Hi there!`)
    }else{
        console.log(`Hello! ${name}`)
    } 
}

// 7d. Create a function 'convertToFahrenheit(celsius)' that takes a number in degrees Celsius and returns a number in degrees Fahrenheit.
// • Formula: Fahrenheit = (Celsius *9 / 5) + 32
// • convertToFahrenheit(25) => 77
function convertToFahrenheit(celsius){
    return (celsius * 9/5) + 32
}
console.log(convertToFahrenheit(25));

// 7e. Create a function 'convertToCeIsius(fahrenheit)' that takes a number in degrees Fahrenheit and returns a number in degrees Celsius.
// • Formula: Celsius = (Fahrenheit - 32) * 5/9
// • convertToCelsius(86) => 30
function convertToCeIsius(fahrenheit){
    return (fahrenheit -32) * 5/9
}
console.log(convertToCeIsius(86));


// 7f. Create a function 'convertTemperature(degrees, unit)' that takes a number and a unit ('C' or 'F'), and converts it into the other unit.
// • convertTemperature(25, 'C') => '77F'
// • convertTemperature(86, 'F') => '30C'
// Note: return a string, and try to reuse the functions from 7d and 7e.


function convertTemperature(degrees, unit){
    if (unit === 'c'){
        const result = (degrees * 9/5) + 32;
        return `${result} F`
    }else if(unit === 'f'){
        const result = (degrees -32) * 5/9;
        return `${result} C`
    }
}
console.log(convertTemperature(25, 'c'))
console.log(convertTemperature(86, 'f'))


/*
7g. Create a function convertLength(length, from, to) that takes a number and a unit ('km' or 'miles') and converts the length to another
unit ('km' or 'miles'). Note: 1 mile = 1.6 km (approximately).
• convertLength(50, 'miles', 'km') => '80 km'
• convertLength(32, 'km', 'miles') => '20 miles'
• convertLength(50, 'km', 'km') => '50 km'

7h. Update convertLength to support converting between km, miles, and also feet. Note: 1 mile = 5280 ft, 1 km = 3281 ft (approximately).
• convertLength(5, 'miles', 'km') => '8 km'
• convertLength(5, 'miles', 'ft') => '26400 ft'
• convertLength(5, 'km', 'ft') => '16405 ft'

7i. Update convertLength so that if you give it an invalid unit, it will return Invalid unit: ${unit}
• convertLength(5, 'lbs', 'lbs') => 'Invalid unit: 'lbs'

*/

function convertLength(length, from, to){

    if(from != 'km' && from != 'miles' && from != 'ft'){
        return `Invalid unit: ${from}`
    }else if(to != 'km' && to != 'miles' && to != 'ft'){
        return `Invalid unit: ${to}`
    } 

    if(from === 'km' && to === 'miles'){
        return `${length / 1.6} ${to}`;

    } else if (from === 'miles' && to === 'km'){
        return `${length * 1.6} ${to}`;
        // دا طريقة تفكري انا حاول تطورها يا محروووس بق
        // const result = length * 1.6;
        // console.log(result);         

        // You can also do if (from === 'km' && to === 'km) { ... }
        // if (from === to) is a trick you can use to save some code.
    }else if(from === 'km' && to === 'ft'){
        return `${length * 3281} ${to}`;

    } else if(from === 'miles' && to === 'ft'){
        return `${length * 5280} ${to}`;

    } else if(from === to){
          return `${length} ${to}`;
    }
}

      console.log(convertLength(50, 'miles', 'km'));
      console.log(convertLength(32, 'km', 'miles'));
      console.log(convertLength(50, 'km', 'km'));

      console.log(convertLength(5, 'miles', 'km'));
      console.log(convertLength(5, 'miles', 'ft'));
      console.log(convertLength(5, 'km', 'ft'));

      console.log(convertLength(5, 'lbs', 'lbs'));
